version: '3.8'

services:

    db:
      image: postgres:16.1
      container_name: db-companies
      restart: always
      volumes:
        - ./sql/create_schema.sql:/docker-entrypoint-initdb.d/create_schema.sql
        - ./sql/data.sql:/docker-entrypoint-initdb.d/data.sql
      environment:
        POSTGRES_DB: ${DB_NAME:-companies}
        POSTGRES_USER: ${DB_USER:-debuggeandoideas}
        POSTGRES_PASSWORD: ${DB_PASSWORD:-udemy}
      ports:
        - '${DB_PORT:-5432}:5432'