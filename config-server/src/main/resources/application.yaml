server:
  port: 7777

spring:
  profile:
    active: default
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: git@github.com:herquez/microservice-config.git
          default-label: main
          clone-on-start: true
          ignore-local-ssh-settings: false

eureka:
  instance:
    instance-id: "${spring.application.name}:${random.value}"
client:
  service-url:
    defaultZone: http://localhost:8761/eureka/
